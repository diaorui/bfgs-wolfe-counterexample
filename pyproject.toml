[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bfgs_ce"
version = "1.0.0"
description = "C^∞ counterexamples for BFGS-type methods under arbitrary strong Wolfe constants"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rui Diao" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "mpmath>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
